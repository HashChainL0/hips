name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HIP front matter
        run: bash scripts/check-frontmatter.sh
      - name: Check required sections
        run: bash scripts/check-sections.sh
      - name: Check the README index
        run: bash scripts/check-index.sh
      - name: Check relative links
        run: bash scripts/check-links.sh
      - name: Check for em dashes
        run: bash scripts/check-dashes.sh
